<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base Sky/Facade Gradient: Deep Navy Blue to Corporate Ocean Teal -->
    <linearGradient id="skyGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#001838" />
      <stop offset="35%" stop-color="#02284C" />
      <stop offset="70%" stop-color="#033F53" />
      <stop offset="100%" stop-color="#004A54" />
    </linearGradient>

    <!-- Glass Pane Sheen Gradient -->
    <linearGradient id="paneSheen1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="40%" stop-color="#2DD4BF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.01" />
    </linearGradient>

    <linearGradient id="paneSheen2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.2" />
    </linearGradient>

    <!-- Structural Steel Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F243A" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#071828" stop-opacity="0.9" />
    </linearGradient>

    <!-- Translucent Glass Grid Pattern -->
    <pattern id="curtainWallGrid" width="120" height="80" patternUnits="userSpaceOnUse">
      <rect width="120" height="80" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
      <line x1="60" y1="0" x2="60" y2="80" stroke="rgba(255,255,255,0.025)" stroke-width="0.75" />
      <line x1="0" y1="40" x2="120" y2="40" stroke="rgba(255,255,255,0.025)" stroke-width="0.75" />
      <rect x="2" y="2" width="56" height="36" fill="rgba(45,212,191,0.015)" />
      <rect x="62" y="42" width="56" height="36" fill="rgba(56,189,248,0.02)" />
    </pattern>
  </defs>

  <!-- 1. Background Fill -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />

  <!-- 2. Architectural Glass Tower Facets (Angled Perspective Glass Panels) -->
  <!-- Left Skyscraper Mass -->
  <polygon points="-100,1080 350,0 750,0 150,1080" fill="url(#paneSheen1)" />
  <polygon points="100,1080 600,0 950,0 350,1080" fill="rgba(0,35,65,0.25)" />
  
  <!-- Center/Right Tower Structure -->
  <polygon points="550,1080 1050,0 1500,0 950,1080" fill="url(#paneSheen2)" />
  <polygon points="850,1080 1350,0 1850,0 1350,1080" fill="rgba(14,165,233,0.04)" />
  <polygon points="1200,1080 1600,0 2100,0 1700,1080" fill="url(#paneSheen1)" />

  <!-- 3. Fine Curtain-Wall Window Grid Overlay -->
  <rect width="1920" height="1080" fill="url(#curtainWallGrid)" opacity="0.85" />

  <!-- 4. Structural Steel Trusses and Diagonal Architecture Mullions -->
  <!-- Main Diagonal Bracing Beams (Left to Right) -->
  <line x1="-200" y1="1080" x2="800" y2="-200" stroke="rgba(255,255,255,0.09)" stroke-width="4" />
  <line x1="0" y1="1200" x2="1100" y2="-100" stroke="rgba(45,212,191,0.12)" stroke-width="3" />
  <line x1="250" y1="1200" x2="1400" y2="-150" stroke="rgba(255,255,255,0.07)" stroke-width="3.5" />
  <line x1="550" y1="1200" x2="1750" y2="-100" stroke="rgba(56,189,248,0.1)" stroke-width="2.5" />
  <line x1="850" y1="1200" x2="2050" y2="-100" stroke="rgba(255,255,255,0.08)" stroke-width="3" />

  <!-- Counter Diagonal Mullions (Right to Left) -->
  <line x1="2100" y1="1100" x2="900" y2="-200" stroke="rgba(255,255,255,0.07)" stroke-width="3" />
  <line x1="1750" y1="1200" x2="650" y2="-200" stroke="rgba(45,212,191,0.09)" stroke-width="2" />
  <line x1="1400" y1="1200" x2="350" y2="-200" stroke="rgba(255,255,255,0.08)" stroke-width="3.5" />
  <line x1="1050" y1="1200" x2="50" y2="-200" stroke="rgba(56,189,248,0.08)" stroke-width="2" />

  <!-- Vertical Skyscraper Columns -->
  <line x1="240" y1="0" x2="240" y2="1080" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  <line x1="480" y1="0" x2="480" y2="1080" stroke="rgba(255,255,255,0.08)" stroke-width="2.5" />
  <line x1="720" y1="0" x2="720" y2="1080" stroke="rgba(45,212,191,0.07)" stroke-width="2" />
  <line x1="960" y1="0" x2="960" y2="1080" stroke="rgba(255,255,255,0.09)" stroke-width="3" />
  <line x1="1200" y1="0" x2="1200" y2="1080" stroke="rgba(45,212,191,0.08)" stroke-width="2" />
  <line x1="1440" y1="0" x2="1440" y2="1080" stroke="rgba(255,255,255,0.07)" stroke-width="2.5" />
  <line x1="1680" y1="0" x2="1680" y2="1080" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Horizontal Floor Beams -->
  <line x1="0" y1="160" x2="1920" y2="160" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" />
  <line x1="0" y1="320" x2="1920" y2="320" stroke="rgba(255,255,255,0.07)" stroke-width="2" />
  <line x1="0" y1="480" x2="1920" y2="480" stroke="rgba(45,212,191,0.06)" stroke-width="2.5" />
  <line x1="0" y1="640" x2="1920" y2="640" stroke="rgba(255,255,255,0.07)" stroke-width="2" />
  <line x1="0" y1="800" x2="1920" y2="800" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" />
  <line x1="0" y1="960" x2="1920" y2="960" stroke="rgba(255,255,255,0.04)" stroke-width="1" />

  <!-- 5. Diagonal Light Shafts (Sky reflections on architectural glass) -->
  <polygon points="300,0 600,0 1200,1080 900,1080" fill="url(#paneSheen1)" opacity="0.6" />
  <polygon points="800,0 1100,0 1700,1080 1400,1080" fill="url(#paneSheen2)" opacity="0.5" />

  <!-- 6. Vignette overlay for centered card focus -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="30%" stop-color="#000000" stop-opacity="0" />
    <stop offset="70%" stop-color="#001226" stop-opacity="0.35" />
    <stop offset="100%" stop-color="#000B1A" stop-opacity="0.65" />
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignette)" />
</svg>